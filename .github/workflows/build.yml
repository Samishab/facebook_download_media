name: Build Setup.exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller --noconfirm --clean --windowed --name FacebookMediaDownloader --collect-all playwright --collect-all sv_ttk --collect-all yt_dlp app.py
      - name: Add ffmpeg (merges video+audio for best quality)
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg
          Copy-Item (Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName dist\FacebookMediaDownloader\
      - name: Build installer
        run: iscc installer\installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Setup
          path: Output/Setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Setup.exe
